<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/output.css">

</head>

<body class="bg-gray-200 flex justify-center items-center min-h-screen px-4">
    <form action="" class="bg-white p-8 border-lg shadow-2xl w-full max-w-lg space-y-6 rounded-2xl">
        <h2 class=" text-black font-bold text-2xl text-center">Contact Us</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" placeholder="Enter your name " class="border border-blue-800 py-2 px-4 rounded-md ">
            <input type="text" placeholder="Enter your last name " class="border border-blue-800 py-2 px-4 rounded-md ">


        </div>
        <input type="email" placeholder="Enter your email address "
            class="border border-blue-800 py-2 px-4 rounded-md  w-full">
        <textarea name="" rows="5" id="" placeholder="Enter your feedback"
            class="w-full border border-blue-800 py-2 px-4 rounded-md "></textarea>
        <label for="" class="inline-flex items-center space-x-2 ">
            <input type="checkbox" class="form-checkbox text-blue-500 w-5 h-5"> <span>I agree to the terms and
                conditions </span>
        </label>
        <button type="submit"
            class="w-full bg-blue-600 text-white py-2 px-4 font-semibold rounded-md hover:bg-blue-800">Submit</button>





    </form>


</body>

</html>
